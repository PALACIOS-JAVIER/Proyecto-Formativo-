version: '3.8'

services:
  # 1. Contenedor de Base de Datos
  db:
    image: postgres:15
    container_name: proyecto_formativo_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: proyecto_formativo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - red_proyecto
    restart: unless-stopped

  # 2. Contenedor del Backend (NestJS + TypeORM)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: proyecto_formativo_backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      FRONTEND_URL: http://informestimi.com
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db
    networks:
      - red_proyecto
    restart: unless-stopped

  # 3. Contenedor del Frontend (React + Vite + Tailwind en Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proyecto_formativo_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - red_proyecto
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:

networks:
  red_proyecto:
    driver: bridge

